# gitleaks configuration for the hooks (.githooks/pre-commit, .githooks/pre-push).
# https://github.com/gitleaks/gitleaks

title = "extension gitleaks config"

[extend]
# The default rules.
useDefault = true

[[allowlists]]
description = "Build output, lockfiles and binary assets"
paths = [
  '''(^|/)target/''',
  '''(^|/)node_modules/''',
  '''(^|/)Cargo\.lock$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''\.(webp|png|jpg|svg|ttf|woff2|wasm)$''',
]

# The cURL to Code tool reads commands that carry credentials, so its tests are full of made-up ones
# (-u 'ann:pa:ss', Authorization: Bearer t0k). Only the two rules about curl, only in that tool's tests.
[[allowlists]]
description = "Made-up credentials in the commands the cURL to Code tool's tests convert"
targetRules = ["curl-auth-user", "curl-auth-header"]
paths = [
  '''(^|/)packages/tools/(logic|ui)/curl-to-code/src/[^/]+\.test\.tsx?$''',
  '''(^|/)packages/tools/(logic|ui)/curl-to-code/src/__snapshots__/[^/]+\.test\.tsx?\.snap$''',
  '''(^|/)scripts/e2e-tools/curl-to-code\.mjs$''',
]

# The licence token's test vectors: tokens signed with a key pair made for one run of
# packages/licence/scripts/vectors.mjs, whose private key was never stored; the licence server checks its signatures
# against them. Only the JWT rule, only that folder.
[[allowlists]]
description = "Test vectors of the licence token (a test key, no private key stored)"
targetRules = ["jwt"]
paths = ['''(^|/)packages/licence/testdata/[^/]+\.json$''']
