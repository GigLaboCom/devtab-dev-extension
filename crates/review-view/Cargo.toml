[package]
name = "review-view"
description = "The review view: two texts compared line by line behind replaceable seams (LineDiffer, …) and shown in two aligned editors. Shared by the browser module and a native viewer."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["view"]
# The gpui view. Without it the crate is the comparison alone, with no gpui in the build:
# `cargo test -p review-view --no-default-features` runs the seams' contract tests in seconds.
view = ["dep:gpui", "dep:gpui-component", "dep:lsp-types", "dep:web-time"]
# Read access to the view's two editors, for probes and examples that look inside it. Not in the shipped module.
inspect = ["view"]
# The view's own tests (editing, the comparison following the edits) in gpui's test app, natively:
# `cargo test -p review-view --features view-tests`. A feature, not dev-dependencies, so `--no-default-features`
# stays a build without gpui and the module never carries gpui's test support.
view-tests = ["view", "gpui/test-support"]
# Grammars that arrive as files while the page runs (src/grammars.rs; the mixed highlighter build of review-wasm,
# docs/editor-base.md): gpui-kit's tree-sitter highlighter, and the runtime itself for the languages' checks. The
# registration's tests run natively: `cargo test -p review-view --features grammar-files`.
grammar-files = ["view", "dep:tree-sitter", "gpui-component/tree-sitter"]
# The `window` example: the view in a native window (`cargo run -p review-view --features window-example --example
# window`). Kept behind a feature so `cargo test` and the wasm module never build the native platform.
window-example = ["inspect", "dep:gpui_platform", "dep:gpui-kit-assets", "gpui-component/syntect"]

[dependencies]
imara-diff.workspace = true
serde.workspace = true

gpui = { workspace = true, optional = true }
# The highlighter (syntect, tree-sitter) is chosen by the binary, not here.
gpui-component = { workspace = true, optional = true }
lsp-types = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }
# The version gpui-kit's highlighter uses (one runtime in the module: the grammars' ABI is checked against it).
tree-sitter = { workspace = true, optional = true }
# The `window` example's icons and native platform.
gpui-kit-assets = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui_platform = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "window"
required-features = ["window-example"]
